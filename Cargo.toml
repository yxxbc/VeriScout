[package]
name = "ves"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "VeriScout (ves) - a Rust web-search / source-verification / visualization agent with a sealed tool surface"
license = "MIT"
# 仓库地址的单一事实来源：报告里的 GitHub 按钮用 env!("CARGO_PKG_REPOSITORY") 读取。
# 换成你的地址后只需重新 cargo build（README 顶部的徽章也指向同一个地址）。
repository = "https://github.com/yxxbc/VeriScout"
default-run = "ves"

[[bin]]
name = "ves"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
ureq = { version = "2.12", features = ["json", "tls"] }
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
